name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^web/' | grep -v '^video-cong-nghe/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' (or 'make fmt') and commit the result."
            exit 1
          fi
          echo "All Go files are gofmt-formatted."

      # go vet (and go build) must type-check main.go, which go:embed's the
      # frontend build output (web/static/**/*.min.*). Those files are
      # gitignored, so they only exist after a frontend build — without this
      # step the embed directive fails with "no matching files found".
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend assets (required by go:embed)
        run: |
          cd web
          chmod +x build-frontend.sh
          ./build-frontend.sh

      - name: Verify go:embed prerequisites
        run: |
          missing=0
          for p in web/static/css/*.min.css web/static/css/tailwind.css \
                   web/static/js/*.min.js web/static/themes/*.min.css \
                   web/static/locales/*.min.json web/static/fonts web/static/webfonts; do
            if ! ls -d $p >/dev/null 2>&1; then
              echo "::error::go:embed prerequisite missing after frontend build: $p"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "main.go embeds these paths. A common cause is a dependency"
            echo "upgrade that changed its file layout (Font Awesome dropping"
            echo "webfonts/). Check web/bun.lock is committed and used."
            exit 1
          fi
          echo "All go:embed prerequisites present."
        shell: bash

      - name: go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      # main.go go:embed's the frontend build output, so it must exist before
      # anything compiles. The embedded assets are platform-independent, so
      # building them on Linux once per job is enough.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend assets (required by go:embed)
        run: |
          cd web
          chmod +x build-frontend.sh
          ./build-frontend.sh
        shell: bash

      - name: Debug font layout (temporary)
        run: |
          echo "--- node_modules fontawesome version ---"
          cat web/node_modules/@fortawesome/fontawesome-free/package.json 2>/dev/null | grep '"version"' || echo "package.json not found"
          echo "--- node_modules webfonts dir ---"
          ls -la web/node_modules/@fortawesome/fontawesome-free/webfonts/ 2>&1 | head -10 || echo "no webfonts in node_modules"
          echo "--- static dir listing ---"
          ls -la web/static/ 2>&1 | head -20
          echo "--- static/css listing ---"
          ls -la web/static/css/ 2>&1 | head -20
          echo "--- url() refs in built css ---"
          grep -o 'url([^)]*woff[^)]*)' web/static/css/style.min.css 2>/dev/null | head -5 || echo "no woff refs in css"
        shell: bash

      - name: Verify go:embed prerequisites
        run: |
          missing=0
          for p in web/static/css/*.min.css web/static/css/tailwind.css \
                   web/static/js/*.min.js web/static/themes/*.min.css \
                   web/static/locales/*.min.json web/static/fonts web/static/webfonts; do
            if ! ls -d $p >/dev/null 2>&1; then
              echo "::error::go:embed prerequisite missing after frontend build: $p"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "main.go embeds these paths. A common cause is a dependency"
            echo "upgrade that changed its file layout (Font Awesome dropping"
            echo "webfonts/). Check web/bun.lock is committed and used."
            exit 1
          fi
          echo "All go:embed prerequisites present."
        shell: bash

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build -o /dev/null ./...
        shell: bash

      - name: Run tests
        run: go test -race -count=1 ./...
        shell: bash

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend assets (required by go:embed)
        run: |
          cd web
          chmod +x build-frontend.sh
          ./build-frontend.sh

      - name: Verify go:embed prerequisites
        run: |
          missing=0
          for p in web/static/css/*.min.css web/static/css/tailwind.css \
                   web/static/js/*.min.js web/static/themes/*.min.css \
                   web/static/locales/*.min.json web/static/fonts web/static/webfonts; do
            if ! ls -d $p >/dev/null 2>&1; then
              echo "::error::go:embed prerequisite missing after frontend build: $p"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "main.go embeds these paths. A common cause is a dependency"
            echo "upgrade that changed its file layout (Font Awesome dropping"
            echo "webfonts/). Check web/bun.lock is committed and used."
            exit 1
          fi
          echo "All go:embed prerequisites present."

      - name: Generate coverage profile
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Print coverage summary
        run: |
          go tool cover -func=coverage.out | tail -n 1
          echo ""
          echo "### Coverage by package" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go test -count=1 -cover ./... 2>/dev/null | grep -E '^(ok|\?)' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
          retention-days: 14
