name: Test

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: telecloud-go:test
          build-args: |
            VERSION=test
            DEFAULT_API_ID=${{ secrets.DEFAULT_API_ID }}
            DEFAULT_API_HASH=${{ secrets.DEFAULT_API_HASH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container starts and listens on port 8091
        run: |
          # Run without --rm so logs survive even if container exits immediately
          docker run --name tc-test -d -p 8091:8091 telecloud-go:test
          sleep 5
          # Always dump logs before any check so crash output is visible in CI
          docker logs tc-test
          # Fail if container has already exited (non-zero exit = crash)
          STATUS=$(docker inspect -f '{{.State.Status}}' tc-test)
          if [ "$STATUS" != "running" ]; then
            echo "Container exited early with status: $STATUS"
            docker rm tc-test
            exit 1
          fi
          curl -sf http://localhost:8091 || curl -sf http://localhost:8091/health || true
          docker stop tc-test
          docker rm tc-test
